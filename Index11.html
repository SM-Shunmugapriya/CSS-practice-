<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Models</title>
</head>
<style>
    .container{
        width:100px;
        height:160px;
        background-color:lightgray;
        padding:10px;
        border-radius:15px;
    }
    .trafficlight1{ 
        color-interpolation-filters: red;

    }
    .trafficlight2{
        color-scheme: orange;

    }
    .trafficlight{
        column-rule-color: aquamarine;

    }
    .stick{
        width:20px;
        height:100px;
        background-color:lightgrey;
        margin-left:49px;
    }

</style>
<body>
    <div class="container">
        <div class="trafficlight1"></div>
        <div class="trafficlight2"></div>
        <div class="trafficlight3"></div>
    </div>
    <div class="stick"></div>


    
</body>
</html>
