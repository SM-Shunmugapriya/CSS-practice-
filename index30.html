<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotate Demo</title>

    <style> 
        table{
            margin:20px;
            width:200px;
            height:200px;
            padding: 50px;
            border:#ccc 1px solid;

        }

        table th,table td{
            border-top:1px solid #fafafa;
            border-bottom:1px solid #e0e0e0;
            border-left: 1px solid #e0e0e0;
            border-right: 1px solid #e0e0e0;        
        }
        table tr:hover{
            transform:rotate(7deg);
            background-color: #aaa;
        }

        
    </style>
</head>
<body> 
    
    <body>
        <table>
            <tr>
                <th>Item</th>
                <th>Price</th>
            </tr>
            <tr>
                <td>Pen</td>
                <td>100</td>
            </tr>
            <tr>
                <td>Shirt</td>
                <td>1000</td>
            </tr>
            <tr>
                <td>Paint</td>
                <td>2000</td>
            </tr>
        </table>
    </body>
</body>
</html>
