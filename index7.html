<!DOCTYPE html>
<html>
    <head>
        <title>Cascading order</title>
        <style>
            #sid #pid {
                color: blue;
            }
            .pclass {
                background-image: pink;
            }
            p#para1 {
                color:green;
            }
            #secid p { 
                color:red;
            }
        </style>
        <meta charset="UTF-8">
    </head>
    <body>
        <section class="scalss" id="sid">
            <p class="pclass" id="pid">Cascading order</p>
        </section>
        <section class="sec" id="secid">
            <p id="parel">this is a sample paragraph</p>
        </section>
    </body>
</html>
